format_version = 1

[canvas]
width = 600
height = 64

[layout]
style = "auto"
max_width = 760
max_height = 420
vertical_min_width = 240
max_candidates = 5
padding = 10
gap = 4
show_preedit = false
show_comments = false

[window]
background = "#191B30F8"
background_alt = "#2C233AF8"
gradient_angle = 135
border = "#BD94C8CC"
border_highlight = "#FFDCEC"
border_width = 1.5
glow = "#EFB6DC38"
radius = 14
backdrop_blur = 12

[preedit]
background = "#211B30CC"
color = "#F5ECF8"
accent = "#FFD0E6"
font_size = 16
radius = 9
padding_x = 12
padding_y = 4

[candidate]
font_size = 17
padding_x = 12
padding_y = 8
radius = 9
text = "#F5ECF8"
label = "#AB98B8"
comment = "#B9A7C3"
hover_background = "#EAA7D520"
selected_background = "#77506EBB"
selected_text = "#FFFFFF"
selected_label = "#FFE3F3"

[navigation]
background = "#FFFFFF05"
foreground = "#E2C4E3"
border = "#FFFFFF00"
radius = 8

[particles]
count = 8
color = "#FFD0E6B0"
size = 3
duration_ms = 5200
drift = 18

[[layers]]
id = "blossom-left"
source = "assets/blossom.svg"
plane = "background"
anchor = "top-left"
x = -8
y = -12
width = 72
height = 46
opacity = 0.45

[[layers]]
id = "blossom-right"
source = "assets/blossom.svg"
plane = "background"
anchor = "bottom-right"
x = 12
y = 20
width = 80
height = 52
opacity = 0.3

[transitions]
show = "fade"
duration_ms = 120
